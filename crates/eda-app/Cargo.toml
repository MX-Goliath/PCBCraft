[package]
name = "eda-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "pcbcraft"
path = "src/main.rs"

[dependencies]
eda-core.workspace = true
eda-geom.workspace = true
eda-io.workspace = true
eda-render.workspace = true
egui.workspace = true
eframe.workspace = true
wgpu.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rfd = "0.15.4"
fontdb = "0.24.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
tempfile = "3.23"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_Xps"] }

[dev-dependencies]
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
