[workspace]
members = ["crates/eda-geom", "crates/eda-core", "crates/eda-io", "crates/eda-render", "crates/eda-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
egui = { version = "=0.32.3", features = ["serde"] }
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "wgpu", "persistence", "accesskit", "x11", "wayland"] }
wgpu = { version = "=25.0.2", default-features = false, features = ["dx12", "vulkan", "metal", "gles", "wgsl"] }
eda-geom = { path = "crates/eda-geom" }
eda-core = { path = "crates/eda-core" }
eda-io = { path = "crates/eda-io" }
eda-render = { path = "crates/eda-render" }
