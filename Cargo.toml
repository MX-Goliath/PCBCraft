[workspace]
members = ["crates/eda-geom", "crates/eda-core", "crates/eda-io", "crates/eda-render", "crates/eda-app"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["MX-Goliath"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
egui = { version = "=0.32.3", features = ["serde"] }
egui-wgpu = { version = "=0.32.3", default-features = false }
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "wgpu", "persistence", "accesskit", "x11", "wayland"] }
wgpu = { version = "=25.0.2", default-features = false, features = ["dx12", "vulkan", "metal", "gles", "wgsl"] }
eda-geom = { path = "crates/eda-geom" }
eda-core = { path = "crates/eda-core" }
eda-io = { path = "crates/eda-io" }
eda-render = { path = "crates/eda-render" }

# Interactive geometry and egui tessellation are too expensive at opt-level 0.
# Keep debug symbols/assertions and incremental builds while exercising real
# editor performance during normal development on both Windows and Linux.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
