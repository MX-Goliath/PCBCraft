name: Release packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: windows
          - os: ubuntu-22.04
            package: linux
          - os: macos-15
            package: macos-arm64
          - os: macos-15-intel
            package: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      PCBCRAFT_UPDATE_REPOSITORY: ${{ github.repository }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release tag and repository privacy
        shell: bash
        run: |
          python scripts/check_privacy.py
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/verify-release.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/verify-release.py --tag "$GITHUB_REF_NAME" --allow-branch
          fi
      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libegl1-mesa-dev dpkg-dev squashfs-tools zsync
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python -m unittest discover -s scripts -p "test_release.py"
      - run: cargo build --locked --release -p eda-app --bin pcbcraft
      - name: Windows installer and portable ZIP
        if: runner.os == 'Windows'
        run: python scripts/build-release.py --format windows-installer --no-build
      - name: Linux DEB and AppImage
        if: runner.os == 'Linux'
        run: |
          python scripts/build-release.py --format deb --no-build
          python scripts/build-appimage.py --no-build --appimagetool "$RUNNER_TEMP/appimagetool"
      - name: macOS DMG
        if: runner.os == 'macOS'
        run: python scripts/build-release.py --format macos --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.package }}
          path: dist/PCBCraft-*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: python scripts/verify-release.py --tag "$GITHUB_REF_NAME" --artifacts dist
      - name: Create a draft with every verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/PCBCraft-* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "PCBCraft $GITHUB_REF_NAME"
